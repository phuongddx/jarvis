# Tests the reduced bootstrap helper under real Linux and macOS shells.
#
# dash rejects bashisms that macOS's bash-in-posix mode silently accepts, so
# the matrix plus explicit dash installation remain the honest POSIX guard.
name: setup-smoke

on:
  push:
    branches: [main]
    paths: ["setup.sh", "tests/test_setup_sh.py", ".github/workflows/setup-smoke.yml"]
  pull_request:
    paths: ["setup.sh", "tests/test_setup_sh.py", ".github/workflows/setup-smoke.yml"]
  workflow_dispatch:

jobs:
  setup-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.4.0

      - name: Show which sh we are testing against
        run: |
          set -eu
          ls -la /bin/sh || true
          sh -c 'echo "sh works"'

      - name: Reject bashisms explicitly
        run: |
          set -eu
          # Parse-only check: no installer side effects.
          sh -n setup.sh
          echo "setup.sh parses under the system sh"

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2

      - name: Install dash
        run: |
          set -eu
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq dash
          else
            brew install dash
          fi

      - name: Run the setup.sh unit tests
        run: |
          set -eu
          uv sync
          uv run pytest tests/test_setup_sh.py -v
