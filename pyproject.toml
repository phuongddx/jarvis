[project]
# The plain `jarvis` name on PyPI is taken by an unrelated package, so the
# distribution is published as `jarvis-mcp`. This MUST stay in sync with the
# project name on the PyPI trusted publisher: if the two disagree, uploads
# fail with "Non-user identities cannot create new projects" rather than
# anything that names the real problem.
#
# The import package, both CLIs, and the MCP server are all `jarvis` — only
# the name you install differs.
#
# (Before 0.5.0 this project was called codeintel and shipped as
# `codeintel-navigation-mcp`, whose plain name was likewise taken — by the
# abandoned Komodo Edit CodeIntel package. That distribution is still
# installable at 0.4.0 and receives no further releases.)
name = "jarvis-mcp"
version = "0.10.0"
description = "Local-first code intelligence MCP server (SCIP navigation + Zoekt search)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "phuongddx", email = "95doanphuong@gmail.com" }
]
keywords = [
    "mcp",
    "model-context-protocol",
    "mcp-server",
    "code-intelligence",
    "code-search",
    "scip",
    "zoekt",
    "claude-code",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Text Processing :: Indexing",
    "Typing :: Typed",
]
# Capped below 3.15: the compiled-wheel matrix ([tool.cibuildwheel] below)
# only builds cp312/cp313/cp314. An uncapped floor would let uv resolve 3.15
# once that becomes its default managed interpreter, find no matching wheel
# (there is no sdist to fall back to), and fail `uvx --from jarvis-mcp
# jarvis-server` outright instead of picking a supported interpreter.
requires-python = ">=3.12,<3.15"
dependencies = [
    # Capped below 2.0: mcp 2.0.0 removed `mcp.server.fastmcp`, which
    # server.py imports, so an uncapped range lets a fresh install resolve a
    # version the server cannot start on. uv.lock hid this during development
    # by pinning 1.x — only installing from PyPI surfaced it.
    "mcp[cli]>=1.2.0,<2.0.0",
    # Runtime must stay >= the gencode version vendored in scip_pb2.py
    # (generated against libprotoc 35.1 — see that file's header). Gencode
    # calls ValidateProtobufRuntimeVersion and refuses an older runtime.
    "protobuf>=7.35.1,<8.0.0",
    "zstandard>=0.23.0,<1.0.0",
    "httpx>=0.27",
    # Grammar providers are base dependencies (spec TSI-02, "Grammar
    # distribution and language coverage"): the syntax baseline must work
    # offline from prebuilt abi3 wheels, and the chunker shares this same
    # curated loader instead of the optional language-pack grab-bag.
    # Runtime pinned to 0.25.2, NOT 0.26.0: the 0.26.0 binding refactor
    # corrupts the heap during the declaration walk -- nondeterministic
    # SIGSEGV/SIGBUS, allocation-layout dependent, reliably triggered by
    # test_declaration_walk_survives_a_large_module_in_fresh_interpreters
    # (jarvis-index#14). Grammar versions are unaffected; 0.25.2 ran the
    # full index pipeline clean where 0.26.0 crashed 8-11 out of 12 runs.
    "tree-sitter==0.25.2",
    "tree-sitter-python==0.25.0",
    "tree-sitter-javascript==0.25.0",
    "tree-sitter-typescript==0.23.2",
    "tree-sitter-java==0.23.5",
    "tree-sitter-kotlin==1.1.0",
    "tree-sitter-swift==0.7.3",
    "tree-sitter-go==0.25.0",
    "tree-sitter-ruby==0.23.1",
    "tree-sitter-rust==0.24.2",
    "tree-sitter-c==0.24.2",
    "tree-sitter-cpp==0.23.4",
    "tree-sitter-c-sharp==0.23.5",
    "tree-sitter-php==0.24.1",
    "tree-sitter-scala==0.26.2",
    "tree-sitter-bash==0.25.1",
    "tree-sitter-sql==0.3.11",
]

[project.optional-dependencies]
watch = ["watchdog>=4.0"]
semantic = [
    "lancedb>=0.20",
    "sentence-transformers>=3.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
]
native = [
    "pyinstaller==6.14.1",
]

[project.urls]
Homepage = "https://github.com/jarvis-intelligence/jarvis-index"
Repository = "https://github.com/jarvis-intelligence/jarvis-index"
Issues = "https://github.com/jarvis-intelligence/jarvis-index/issues"
Changelog = "https://pypi.org/project/jarvis-mcp/#history"

[project.scripts]
jarvis = "jarvis.index_cli:main"
jarvis-server = "jarvis.server:main"

[build-system]
# Cython is listed unconditionally: build-system requires is static, and the
# release path (JARVIS_COMPILE=1 in publish-pypi.yml) needs it. Dev builds
# pay one extra download in the isolated build env and compile nothing.
# Capped below the next major, like every dependency below: this resolves
# fresh in CI at release time with no uv.lock protection, and setup.py
# overrides a semi-internal setuptools API (`build_py.find_package_modules`)
# that could shift between majors.
requires = ["setuptools>=80.9,<90", "Cython>=3.1,<4"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# The distribution is `jarvis-mcp`; the import package is and stays `jarvis`.
# src-layout with an explicit package list -- setuptools finds src/jarvis
# regardless of the dist name, so no module-name mapping is needed here
# (uv_build required one; see git history if archaeology calls).
package-dir = { "" = "src" }
packages = ["jarvis"]

[tool.setuptools.package-data]
# Dashboard SPA assets ride in every wheel; check_wheel_contents.py
# guards their presence at release time.
jarvis = ["dashboard_assets/*.html", "dashboard_assets/*.js", "dashboard_assets/*.css"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: exercises real external binaries (scip-python, scip, zoekt-index)",
    "interactive_input: monkeypatches builtins.input/isatty for the semantic-offer TTY prompt",
]

[tool.cibuildwheel]
# cp312..cp314 x {linux x86_64/aarch64, macOS arm64/x86_64}; the runner list
# in publish-pypi.yml supplies the platforms. musllinux and Windows are
# skipped -- setup.sh does not support them, so nothing could consume the
# wheels. No sdist is ever built: platforms outside this matrix must fail
# loudly rather than fall back to readable source.
build = ["cp312-*", "cp313-*", "cp314-*"]
skip = ["*-musllinux_*"]
environment = { JARVIS_COMPILE = "1" }
# The unit suite against the INSTALLED compiled wheel is the empirical gate
# for Cython semantic fidelity (frozen dataclasses, `str | None`, ...). This
# does NOT install the `semantic` extra -- pulling torch into 12 builds
# across 4 runners (including an aarch64 container) would be expensive and
# flaky -- so tests gated behind `pytest.importorskip("lancedb")` skip here.
# The grammar providers are base dependencies (tree-sitter cutover, spec
# TSI-02), so real-parser tests now run inside these wheel builds; only
# semantic-extra coverage remains skipped. Full-extras compiled-wheel
# coverage is not yet automated.
test-requires = ["pytest>=8.3"]
# test_setup_sh.py is excluded: it tests the repo's bootstrap script, not the
# wheel, and it hard-requires dash (its own first test guards on that), which
# manylinux containers do not ship. Proven the hard way: v0.6.0's first
# publish run failed exactly there, inside the cp312 manylinux test phase.
#
# interactive_input-marked tests are excluded too: cibuildwheel's isolated
# --test-command subprocess does not give pytest a real, monkeypatch-honoring
# stdin the way the regular unit-test job's interpreter does, so
# `builtins.input` replacement in these tests intermittently loses the race
# to pytest's own capture-mode stdin guard (`OSError: pytest: reading from
# stdin while output is captured!`). Proven the hard way: v0.7.0's first
# publish run failed exactly there, on every platform in the matrix. The
# regular unit job (test.yml) already exercises these tests successfully on
# every push, so no real coverage is lost -- only the compiled-wheel smoke
# pass narrows.
test-command = "pytest {project}/tests -m 'not integration and not interactive_input' -q --ignore={project}/tests/test_setup_sh.py"
